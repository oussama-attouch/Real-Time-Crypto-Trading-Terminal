# ==============================================================================
# Phase 1 infrastructure: Kafka (KRaft, single node) + PostgreSQL
#
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f kafka
#   docker compose down          # keep data
#   docker compose down -v       # wipe data (also wipes the KRaft cluster id)
#
# Compose v2 drops the top-level `version:` key (it is obsolete and warns).
# ==============================================================================

name: crypto-terminal

services:

  # ---------------------------------------------------------------------------
  # Kafka 4.3.1 in KRaft mode: NO ZooKeeper, NO separate controller node.
  # Kafka 4.x is KRaft-only by design, which matches the "no Zookeeper"
  # requirement without relying on a deprecated 3.x compatibility flag.
  #
  # Single node plays both roles (broker, controller) because this is a dev
  # topology. Production needs 3+ controllers with an odd quorum.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: terminal-kafka
    hostname: kafka

    ports:
      # Host-run Spring Boot connects here. Must equal the EXTERNAL advertised
      # listener, otherwise clients get "Connection to node -1 could not be
      # established" after the bootstrap handshake.
      - "9092:9092"

    environment:
      # --- identity / KRaft quorum -------------------------------------------
      # A fixed 22-char base64url cluster id (16 raw bytes). Pinning it means the
      # metadata log stays valid across `docker compose down && up`; without it a
      # fresh id per boot can leave an old volume unreadable.
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # --- listeners ---------------------------------------------------------
      # INTERNAL 29092 : for other containers (advertised as kafka:29092)
      # EXTERNAL 9092  : for the host / Spring Boot (advertised as localhost:9092)
      # CONTROLLER 9093: KRaft quorum traffic, never advertised to clients
      #
      # The controller listener is NOT in KAFKA_ADVERTISED_LISTENERS on purpose:
      # KRaft controllers are not advertised, they are reached via the quorum
      # voters list.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- single-broker dev replication (RF=1 everywhere, else ISR never forms)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # --- broker behaviour --------------------------------------------------
      # Default partition count for auto-created topics. The real topic is
      # declared explicitly by a NewTopic bean; this is only a safety net so a
      # typo cannot silently create a 1-partition topic.
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Consumer-group joins should be instant in dev; no 3s rebalance stall
      # (that stall would look like "dropped messages" to the browser).
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 24h retention: enough to replay a session while iterating in Phase 2.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      # Runs a real broker API call, not just a TCP probe: "accepting connections"
      # is not the same as "controller elected and metadata ready".
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 40s

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 — provisioned and ready, not yet on the hot path in Phase 1.
  # Used from Phase 2 onwards for trade archive / candle aggregation.
  #
  # The HikariCP pool in application.yml is configured to boot lazily, so the
  # app does not depend on this service being up.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: terminal-postgres
    hostname: postgres

    ports:
      - "5433:5432"

    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trader
      # Dev-only credential. Override via .env / secrets in any shared env.
      POSTGRES_PASSWORD: trader_dev_pw
      # Keep the cluster in a sub-directory so a bind-mounted parent dir stays clean.
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Drop *.sql / *.sh here to run them on first initialisation only.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  kafka-data:
    name: crypto-terminal-kafka-data
  postgres-data:
    name: crypto-terminal-postgres-data
